# Per-visitor rate limits, so one client hammering the site can't run up the
# outbound-bandwidth bill. Fly's proxy passes the real client address in
# Fly-Client-IP ($remote_addr would be the proxy itself). Requests without the
# header — e.g. `docker run` locally — have an empty key and aren't limited.
limit_req_zone $http_fly_client_ip zone=pages:10m rate=5r/s;
limit_req_zone $http_fly_client_ip zone=images:10m rate=1r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A location's own add_header replaces these rather than adding to them,
    # so every location below that sets a header repeats them too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted build output — safe to cache forever. A first visit pulls
    # about ten of these at once, which the burst allows for.
    location /assets/ {
        limit_req zone=pages burst=20 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Photos are by far the heaviest files, so they get the tightest limit.
    # A real visit loads each one once.
    location /images/ {
        limit_req zone=images burst=10 nodelay;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Prerendered pages: / -> /index.html.
    location / {
        limit_req zone=pages burst=20 nodelay;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html =404;
    }

    # Unknown paths get the app shell, which renders the 404 ErrorBoundary.
    # The `=404` keeps the real status code instead of answering 200.
    error_page 404 =404 /__spa-fallback.html;

    location = /__spa-fallback.html {
        internal;
    }
}
