server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fingerprinted build output — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Prerendered pages: /about -> /about/index.html.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    # Unknown paths get the app shell, which renders the 404 ErrorBoundary.
    # The `=404` keeps the real status code instead of answering 200.
    error_page 404 =404 /__spa-fallback.html;

    location = /__spa-fallback.html {
        internal;
    }
}
